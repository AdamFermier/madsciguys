# Build and deploy a Hugo site to GitHub Pages with branch-specific destinations
name: Build and deploy Hugo site to Pages

on:
  push:
    branches:
      - main
      - dev
      - staging
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy (main, dev, staging)'
        required: false
        default: main

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.paths.outputs.branch }}
      subdir: ${{ steps.paths.outputs.subdir }}
      baseUrl: ${{ steps.paths.outputs.baseUrl }}
    env:
      HUGO_VERSION: 0.134.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Setup Node.js
        if: hashFiles('package*.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: ${{ hashFiles('package-lock.json', 'npm-shrinkwrap.json', 'yarn.lock') != '' && 'npm' || '' }}

      - name: Install Node.js dependencies
        run: |
          if [ -f "package-lock.json" ] || [ -f "npm-shrinkwrap.json" ]; then
            npm ci
          elif [ -f "package.json" ]; then
            npm install
          fi

      - name: Determine deployment branch and paths
        id: paths
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BRANCH="${{ github.event.inputs.branch }}"
          else
            BRANCH="${GITHUB_REF##*/}"
          fi

          case "$BRANCH" in
            main)
              SUBDIR=''
              BASEURL='https://adamfermier.github.io/madsciguys/'
              ;;
            dev)
              SUBDIR='madsciguys.dev'
              BASEURL='https://adamfermier.github.io/madsciguys.dev/'
              ;;
            staging)
              SUBDIR='madsciguys.staging'
              BASEURL='https://adamfermier.github.io/madsciguys.staging/'
              ;;
            *)
              echo "Unsupported branch: $BRANCH"
              exit 1
              ;;
          esac

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "subdir=$SUBDIR" >> "$GITHUB_OUTPUT"
          echo "baseUrl=$BASEURL" >> "$GITHUB_OUTPUT"

      - name: Cache Hugo resources
        uses: actions/cache@v4
        with:
          path: resources
          key: ${{ runner.os }}-hugo-resources-${{ hashFiles('**/*.md') }}
          restore-keys: |
            ${{ runner.os }}-hugo-resources-

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
          TZ: America/Los_Angeles
          BASE_URL: ${{ steps.paths.outputs.baseUrl }}
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "$BASE_URL" \
            --destination public \
            --logLevel info

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: public
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: public

      - name: Deploy to gh-pages root
        if: ${{ needs.build.outputs.subdir == '' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          keep_files: true
          allow_empty_commit: true
          commit_message: 'Deploy Hugo site from main branch'

      - name: Deploy to gh-pages environment directory
        if: ${{ needs.build.outputs.subdir != '' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          destination_dir: ${{ needs.build.outputs.subdir }}
          keep_files: true
          allow_empty_commit: true
          commit_message: 'Deploy Hugo site from ${{ needs.build.outputs.branch }} branch'
